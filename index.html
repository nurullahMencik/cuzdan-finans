<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cüzdan · Kişisel finans paneli</title>
    <meta
      name="description"
      content="Cüzdan: banka ekstresi içe aktarma, otomatik kategorileme, bütçe ve abonelik tespiti. Verileriniz yalnızca tarayıcınızda kalır."
    />
    <meta name="theme-color" content="#f4f3ef" />
    <link rel="icon" type="image/svg+xml" href="/cuzdan-finans/favicon.svg" />
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var p = localStorage.getItem('cuzdan.theme')
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (localStorage.getItem('cuzdan.locale') === 'en') document.documentElement.lang = 'en'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
